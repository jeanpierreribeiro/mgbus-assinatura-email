<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acesso · Gerador de assinaturas MG Bus</title>
<link rel="icon" href="/logo.png">
<style>
  :root{--brand:#0A3D7A;--ink:#1F2430;--muted:#6B7280;--line:#E3E7EE}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F5F9;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);padding:20px}
  .card{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:0 10px 30px rgba(16,24,40,.06);text-align:center}
  .card img{width:96px;height:96px;display:block;margin:0 auto 14px}
  h1{font-size:17px;margin:0 0 4px}
  p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.45}
  label{display:block;text-align:left;font-size:12.5px;margin-bottom:6px;color:#374151}
  .pw{position:relative}
  input{width:100%;padding:11px 44px 11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,61,122,.12)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;font-size:12px}
  button[type=submit]{margin-top:14px;width:100%;padding:11px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer}
  button[type=submit]:hover{filter:brightness(1.1)}
  button[type=submit]:disabled{opacity:.7;cursor:wait}
  .err{display:none;margin:0 0 14px;padding:9px 12px;border-radius:8px;background:#FEF0EF;color:#912018;border:1px solid #FBD3CF;font-size:12.5px;text-align:left}
  .err.show{display:block}
</style>
</head>
<body>
  <form class="card" method="post" action="/login" id="f">
    <img src="/logo.png" alt="MG Bus &amp; Facin Serviços" width="96" height="96">
    <h1>Gerador de assinaturas de e-mail</h1>
    <p>Digite o código de acesso para continuar.</p>
    <div class="err" id="err" role="alert">Código incorreto. Confira e tente de novo.</div>
    <label for="codigo">Código de acesso</label>
    <div class="pw">
      <input type="password" id="codigo" name="codigo" required autocomplete="current-password" autofocus>
      <button class="eye" type="button" id="eye" aria-label="Mostrar código">Mostrar</button>
    </div>
    <button type="submit" id="go">Entrar</button>
  </form>
<script>
  if (new URLSearchParams(location.search).has('erro')) document.getElementById('err').classList.add('show');
  var i = document.getElementById('codigo'), e = document.getElementById('eye');
  e.onclick = function(){ var s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.textContent = s ? 'Ocultar' : 'Mostrar'; i.focus(); };
  document.getElementById('f').onsubmit = function(){ var b = document.getElementById('go'); b.disabled = true; b.textContent = 'Entrando...'; };
</script>
</body>
</html>
